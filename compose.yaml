services:
  db:
    image: postgres:16-alpine
    container_name: kepin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kepin
      POSTGRES_PASSWORD: kepin
      POSTGRES_DB: kepin
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kepin"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    profiles: ["full"]
    container_name: kepin-backend
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://kepin:kepin@db:5432/kepin
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://frontend:3000
      AUTHORIZATION_ENABLED: "false"
      SQL_ECHO: "false"
      LOG_LEVEL: INFO
      SMTP_HOST: smtp-sink
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      SMTP_FROM: noreply@kepin.io
      PUBLIC_APP_URL: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/alembic:/app/alembic:ro
      - smtp-emails:/tmp
    depends_on:
      db:
        condition: service_healthy
      smtp-sink:
        condition: service_healthy

  smtp-sink:
    profiles: ["full"]
    container_name: kepin-smtp-sink
    restart: unless-stopped
    image: python:3.13-slim
    volumes:
      - ./backend/tests/regression/smtp_sink.py:/app/smtp_sink.py:ro
      - smtp-emails:/tmp
    command: sh -c "pip install -q aiosmtpd && python /app/smtp_sink.py"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket,sys; sys.exit(0 if socket.socket().connect_ex(('127.0.0.1',1025))==0 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    profiles: ["full"]
    container_name: kepin-frontend
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:3000"
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
  smtp-emails:
    driver: local
